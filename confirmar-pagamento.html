<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/confirmar-pagamento.css">
    <title>Confirmar Pagamento</title>
</head>

<body>
    <div class="container">
        <div class="card">
            <button class="dismiss" type="button">×</button>
            <div class="header">

                <div class="div_image_v">
                    <div class="image">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path d="M20 7L9.00004 18L3.99994 13" stroke="#000000" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round">
                                </path>
                            </g>
                        </svg>
                    </div>
                </div>
                <div class="content">
                    <span class="title">Pedido Concluido</span>
                    <p class="message">Obrigado por sua compra. Seu pacote será entregue dentro de 2 dias úteis após a compra</p>
                </div>
            </div>
        </div>
    </div>
    
</body>

</html>
